version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # LWJGL must match the version Minecraft ships, not the latest release.
      # Bumping it alone splits the LWJGL stack and breaks GLFW at class-init.
      - dependency-name: "org.lwjgl:*"
    groups:
      patch-updates:
        update-types:
          - patch
      minor-updates:
        update-types:
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"
